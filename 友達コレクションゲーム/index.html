<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ともコレ! 友達コレクションゲーム</title>
<style>
  :root {
    --pink: #ff8fab;
    --pink-light: #ffe3ec;
    --purple: #b088f9;
    --yellow: #ffd166;
    --mint: #6fe3c0;
    --bg: #fff6fa;
    --text: #5a3e5a;
    --card-shadow: 0 6px 0 rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", "Yu Gothic", sans-serif;
    background: linear-gradient(160deg, #fff6fa 0%, #ffeef5 40%, #f0e8ff 100%);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 40px;
  }
  header {
    text-align: center;
    padding: 22px 12px 10px;
  }
  header h1 {
    margin: 0;
    font-size: 1.8em;
    color: var(--pink);
    text-shadow: 2px 2px 0 #fff;
    letter-spacing: 2px;
  }
  header p { margin: 4px 0 0; font-size: 0.85em; opacity: 0.7; }

  .stat-bar {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin: 14px auto;
    flex-wrap: wrap;
  }
  .stat-pill {
    background: #fff;
    border-radius: 999px;
    padding: 8px 18px;
    box-shadow: var(--card-shadow);
    font-weight: bold;
    font-size: 0.95em;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  nav.tabs {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 10px 0 20px;
  }
  nav.tabs button {
    border: none;
    background: #fff;
    color: var(--text);
    padding: 10px 22px;
    border-radius: 999px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: var(--card-shadow);
    font-size: 0.95em;
    transition: transform 0.1s;
  }
  nav.tabs button.active {
    background: var(--pink);
    color: #fff;
  }
  nav.tabs button:hover { transform: translateY(-2px); }

  main { max-width: 900px; margin: 0 auto; padding: 0 16px; }
  .panel { display: none; }
  .panel.active { display: block; }

  /* Collection grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 14px;
  }
  .friend-card {
    background: #fff;
    border-radius: 18px;
    box-shadow: var(--card-shadow);
    padding: 12px 8px 10px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.12s;
    border: 3px solid transparent;
  }
  .friend-card:hover { transform: translateY(-4px) scale(1.03); }
  .friend-card.locked { opacity: 0.55; cursor: default; }
  .friend-card.locked:hover { transform: none; }
  .friend-card .emoji { font-size: 2.4em; }
  .friend-card .name { font-size: 0.85em; font-weight: bold; margin-top: 4px; }
  .friend-card .lv { font-size: 0.7em; color: var(--purple); }
  .affinity-mini {
    height: 6px;
    background: var(--pink-light);
    border-radius: 4px;
    margin-top: 6px;
    overflow: hidden;
  }
  .affinity-mini > div { height: 100%; background: var(--pink); }
  .rarity-badge {
    display: inline-block;
    font-size: 0.65em;
    font-weight: bold;
    padding: 2px 8px;
    border-radius: 999px;
    margin-bottom: 4px;
    letter-spacing: 1px;
  }
  .modal-rarity { font-size: 0.75em; margin-bottom: 8px; }

  /* Quiz panel */
  .quiz-box {
    background: #fff;
    border-radius: 24px;
    box-shadow: var(--card-shadow);
    padding: 20px;
    max-width: 480px;
    margin: 0 auto 20px;
  }
  .quiz-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: bold;
    font-size: 0.9em;
    margin-bottom: 10px;
  }
  .quiz-diff-badge { font-size: 0.85em; }
  .quiz-question {
    font-size: 1.05em;
    font-weight: bold;
    text-align: center;
    margin: 10px 0 16px;
  }
  .quiz-choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .quiz-choice-btn {
    background: var(--pink-light);
    border: none;
    border-radius: 12px;
    padding: 12px 10px;
    font-size: 0.9em;
    font-weight: bold;
    color: var(--text);
    cursor: pointer;
    transition: transform 0.1s;
  }
  .quiz-choice-btn:hover:not(:disabled) { transform: translateY(-2px); }
  .quiz-choice-btn:disabled { cursor: default; opacity: 0.7; }
  .quiz-choice-btn.correct { background: #c8f2d8; color: #1e8a4c; }
  .quiz-choice-btn.wrong { background: #ffd9dd; color: #c23a52; }
  .quiz-feedback { text-align: center; font-weight: bold; margin-top: 12px; min-height: 1.2em; }
  .quiz-feedback.ok { color: #2fae66; }
  .quiz-feedback.ng { color: #e0607a; }
  .rarity-legend { font-size: 0.75em; font-weight: bold; margin: 4px 0 0; }

  /* Gacha panel */
  .gacha-box {
    text-align: center;
    background: #fff;
    border-radius: 24px;
    box-shadow: var(--card-shadow);
    padding: 30px 20px;
    max-width: 420px;
    margin: 0 auto;
  }
  .gacha-machine {
    font-size: 5em;
    margin-bottom: 10px;
  }
  .gacha-btn {
    background: var(--purple);
    color: #fff;
    border: none;
    padding: 14px 30px;
    border-radius: 999px;
    font-size: 1.1em;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 5px 0 #8a5fd6;
    margin-top: 10px;
  }
  .gacha-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #8a5fd6; }
  .gacha-btn:disabled { background: #ccc; box-shadow: 0 5px 0 #999; cursor: not-allowed; }
  .gacha-result {
    margin-top: 20px;
    padding: 16px;
    border-radius: 16px;
    background: var(--pink-light);
    display: none;
  }
  .gacha-result.show { display: block; animation: pop 0.35s ease; }
  @keyframes pop { 0% { transform: scale(0.5); opacity: 0;} 100% { transform: scale(1); opacity: 1; } }
  .gacha-result .emoji { font-size: 3.5em; }

  /* Modal */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(90, 62, 90, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 50;
  }
  .overlay.show { display: flex; }
  .modal {
    background: #fff;
    border-radius: 22px;
    padding: 24px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 0 rgba(0,0,0,0.1);
  }
  .modal .emoji { font-size: 4em; }
  .modal h2 { margin: 6px 0 2px; color: var(--pink); }
  .modal .topic { font-size: 0.85em; color: var(--purple); margin-bottom: 6px; }
  .modal .catchphrase { font-style: italic; font-size: 0.9em; opacity: 0.75; margin-bottom: 10px; }
  .affinity-bar {
    height: 14px;
    background: var(--pink-light);
    border-radius: 8px;
    overflow: hidden;
    margin: 6px 0;
  }
  .affinity-bar > div {
    height: 100%;
    background: linear-gradient(90deg, var(--pink), var(--purple));
    transition: width 0.3s;
  }
  .lv-label { font-size: 0.85em; font-weight: bold; color: var(--purple); }
  .talk-choices {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .talk-btn {
    background: var(--mint);
    border: none;
    color: #fff;
    font-weight: bold;
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 0.85em;
    cursor: pointer;
    box-shadow: 0 5px 0 #45b394;
  }
  .talk-btn.deep {
    background: var(--pink);
    box-shadow: 0 5px 0 #e06f91;
  }
  .talk-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #45b394; }
  .talk-btn.deep:active { box-shadow: 0 2px 0 #e06f91; }
  .talk-hint { font-size: 0.7em; opacity: 0.6; margin: 8px 0 0; }
  .dialogue-log {
    margin-top: 12px;
    background: #faf8ff;
    border-radius: 12px;
    padding: 10px;
    font-size: 0.85em;
    min-height: 40px;
    text-align: left;
  }
  .close-btn {
    margin-top: 14px;
    background: none;
    border: none;
    color: #aaa;
    text-decoration: underline;
    cursor: pointer;
  }
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--purple);
    color: #fff;
    padding: 10px 20px;
    border-radius: 999px;
    font-weight: bold;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-8px); }
  footer {
    text-align: center;
    font-size: 0.75em;
    opacity: 0.5;
    margin-top: 30px;
  }
  .reset-btn {
    display: block;
    margin: 6px auto 0;
    background: none;
    border: none;
    color: #b98fa5;
    font-size: 0.75em;
    text-decoration: underline;
    cursor: pointer;
  }
</style>
</head>

  <h1>🌸 ともコレ! 🌸</h1>
  <p>友達をコレクションして、なかよくなろう</p>

  <button id="tabGacha">🎰 出会いガチャ</button>

<main>

  <section id="panelGacha" class="panel">

    <div class="gacha-box">

</main>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<div class="toast" id="toast"></div>

<footer>進行状況は自動でこの端末に保存されます</footer>

    { name: "かい", emoji: "🐳", topic: "ごはん", rarity: "N", catchphrase: "頼れる面倒見のいいお兄さん",
      lines: { lv1: ["かいだ。よろしくな、気軽に頼っていいぞ。", "困ったことがあったら言えよ。"],
        lv2: ["お前と話すの、楽しいぞ。", "頼ってくれると嬉しいもんだぞ。"],

        lv5: ["お前と過ごす日々が一番の宝物だぞ。", "一生そばで支えていくからな。"] } },
    { name: "すず", emoji: "🦋", topic: "音楽", rarity: "R", catchphrase: "夢見がちな芸術家肌",
      lines: { lv1: ["すずです、よろしく……絵になる出会いみたい", "あなたにインスピレーション感じるかも"],

        lv4: ["あなたは私の人生に欠かせない存在みたい", "この気持ち、絵でも言葉でも表せないくらい"],
        lv5: ["あなたと歩む未来が一番美しい作品みたい", "永遠にあなたを描き続けたいな"] } },
    { name: "りょう", emoji: "🐧", topic: "読書", rarity: "N", catchphrase: "みんなの世話を焼く委員長気質",
      lines: { lv1: ["りょうです。困ったことがあれば言ってくださいね", "しっかり者でいたいので、頼ってくれて構いませんよ"],
        lv2: ["あなたのこと、少し気にかけているんですよ", "無理していませんか?心配になるでしょう"],
        lv3: ["あなたは私が守りたい大切な人になりました", "そばで支えたいと思っているんです"],
        lv4: ["あなたは私にとってかけがえのない存在でしょう", "ずっと隣で見守っていたいんです"],
        lv5: ["一生あなたを支え続けると誓います", "あなたと歩む未来が一番の幸せでしょう"] } }
  ];

  const ROSTER = FRIEND_DATA.map((f, i) => ({ id: "f" + i, ...f }));

  const DIFF_META = {
    1: { label: "やさしい",   stars: "★☆☆", color: "#3bb273" },
    2: { label: "ふつう",     stars: "★★☆", color: "#e0a30f" },
    3: { label: "むずかしい", stars: "★★★", color: "#e0607a" }
  };
  const REWARD_BY_DIFF = { 1: 12, 2: 22, 3: 35 };

  const QUESTIONS = [
    { difficulty: 1, q: "日本の首都はどこ?", choices: ["大阪", "東京", "京都", "名古屋"], answer: 1 },
    { difficulty: 1, q: "1年は何日?(うるう年を除く)", choices: ["364日", "365日", "366日", "360日"], answer: 1 },
    { difficulty: 1, q: "虹は何色に例えられることが多い?", choices: ["5色", "6色", "7色", "8色"], answer: 2 },
    { difficulty: 1, q: "水は1気圧でセ氏何度で沸騰する?", choices: ["90度", "100度", "110度", "120度"], answer: 1 },
    { difficulty: 1, q: "「こんにちは」を英語で言うと?", choices: ["Good night", "Hello", "Goodbye", "Sorry"], answer: 1 },
    { difficulty: 1, q: "1週間は何日?", choices: ["5日", "6日", "7日", "8日"], answer: 2 },
    { difficulty: 2, q: "成人の骨はおよそ何本?", choices: ["106本", "206本", "306本", "406本"], answer: 1 },
    { difficulty: 2, q: "世界で一番面積が大きい国は?", choices: ["アメリカ", "中国", "カナダ", "ロシア"], answer: 3 },
    { difficulty: 2, q: "光の速さは秒速およそ何km?", choices: ["3千km", "3万km", "30万km", "300万km"], answer: 2 },
    { difficulty: 2, q: "「油断□□」に入る言葉は?", choices: ["大敵", "一番", "絶好", "無用"], answer: 0 },
    { difficulty: 2, q: "人間の心臓は1日に約何回拍動する?", choices: ["1万回", "3万回", "10万回", "50万回"], answer: 2 },
    { difficulty: 2, q: "日本で一番高い山は?", choices: ["富士山", "槍ヶ岳", "北岳", "御嶽山"], answer: 0 },
    { difficulty: 3, q: "元素記号「Au」は何の元素?", choices: ["銀", "銅", "金", "アルミニウム"], answer: 2 },
    { difficulty: 3, q: "世界最古の企業と言われる金剛組の創業は何世紀?", choices: ["6世紀", "10世紀", "14世紀", "18世紀"], answer: 0 },
    { difficulty: 3, q: "DNAの二重らせん構造をワトソンと共に発見したのは誰?", choices: ["アインシュタイン", "クリック", "ダーウィン", "ニュートン"], answer: 1 },
    { difficulty: 3, q: "「一石二鳥」に相当する英語のことわざは?", choices: ["Kill two birds with one stone", "Better late than never", "Actions speak louder than words", "A piece of cake"], answer: 0 },
    { difficulty: 3, q: "日本国憲法が施行されたのは西暦何年?", choices: ["1945年", "1946年", "1947年", "1950年"], answer: 2 },
    { difficulty: 3, q: "人体で最も硬い部分はどこ?", choices: ["骨", "爪", "歯のエナメル質", "軟骨"], answer: 2 }
  ];

  const SAVE_KEY = "tomocolle_save_v1";
  function loadState() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) {
        const s = JSON.parse(raw);
        if (!s.difficulty) s.difficulty = 1;
        return s;
      }
    } catch (e) {}
    return { points: 30, friends: {}, difficulty: 1 };
  }
  function saveState() { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }

  const state = loadState();

  function ownedIds() { return Object.keys(state.friends); }
  function isOwned(id) { return !!state.friends[id]; }
  function affinity(id) { return state.friends[id] ? state.friends[id].affinity : 0; }

  function levelInfo(aff) {
    if (aff >= 80) return { lv: 5, key: "lv5", label: "ずっと一緒" };
    if (aff >= 60) return { lv: 4, key: "lv4", label: "親友" };
    if (aff >= 40) return { lv: 3, key: "lv3", label: "仲良し" };
    if (aff >= 20) return { lv: 2, key: "lv2", label: "友達" };
    return { lv: 1, key: "lv1", label: "顔見知り" };
  }

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => t.classList.remove("show"), 1800);
  }

  function renderStats() {
    document.getElementById("points").textContent = state.points;
    document.getElementById("ownedCount").textContent = ownedIds().length;
    document.getElementById("totalCount").textContent = ROSTER.length;
    const dm = DIFF_META[state.difficulty];
    const diffPill = document.getElementById("diffPill");
    diffPill.textContent = `🧠 難易度: ${dm.stars} ${dm.label}`;
    diffPill.style.color = dm.color;
    updateGachaBtn();
  }

  function renderGrid() {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    ROSTER.forEach(f => {
      const owned = isOwned(f.id);
      const card = document.createElement("div");
      card.className = "friend-card" + (owned ? "" : " locked");
      if (owned) {
        const aff = affinity(f.id);
        const lv = levelInfo(aff);
        const rm = RARITY_META[f.rarity];
        card.style.borderColor = rm.color;
        card.innerHTML = `
          <div class="rarity-badge" style="background:${rm.bg};color:${rm.color}">${rm.stars}</div>
          <div class="emoji">${f.emoji}</div>
          <div class="name">${f.name}</div>
          <div class="lv">Lv.${lv.lv} ${lv.label}</div>
          <div class="affinity-mini"><div style="width:${aff}%"></div></div>
        `;
        card.addEventListener("click", () => openModal(f.id));
      } else {
        card.innerHTML = `
          <div class="emoji">❓</div>
          <div class="name">？？？</div>
          <div class="lv">未出会い</div>
        `;
      }
      grid.appendChild(card);
    });
  }

  function openModal(id) {
    const f = ROSTER.find(x => x.id === id);
    const aff = affinity(id);
    const lv = levelInfo(aff);
    const rm = RARITY_META[f.rarity];
    const modal = document.getElementById("modal");
    modal.innerHTML = `
      <div class="rarity-badge modal-rarity" style="background:${rm.bg};color:${rm.color}">${rm.stars} ${rm.label}</div>
      <div class="emoji">${f.emoji}</div>
      <h2>${f.name}</h2>
      <div class="topic">好きな話題: ${f.topic}</div>
      <div class="catchphrase">${f.catchphrase}</div>
      <div class="lv-label">Lv.${lv.lv} ${lv.label} (${aff}/100)</div>
      <div class="affinity-bar"><div style="width:${aff}%"></div></div>
      <div class="talk-choices">
        <button class="talk-btn casual" id="talkCasualBtn">🌱 気軽に話す</button>
        <button class="talk-btn deep" id="talkDeepBtn">🔥 深く踏み込んで話す</button>
      </div>
      <p class="talk-hint">深く話すと好感度が伸びる代わりに、クイズの難易度も上がるよ</p>
      <div class="dialogue-log" id="dialogueLog">まだ何も話していません</div>
      <button class="close-btn" id="closeModal">閉じる</button>
    `;
    document.getElementById("overlay").classList.add("show");
    document.getElementById("closeModal").addEventListener("click", closeModal);
    document.getElementById("talkCasualBtn").addEventListener("click", () => talkTo(id, "casual"));
    document.getElementById("talkDeepBtn").addEventListener("click", () => talkTo(id, "deep"));
  }
  function closeModal() { document.getElementById("overlay").classList.remove("show"); }

  function talkTo(id, style) {
    const rec = state.friends[id];
    if (!rec) return;
    const before = rec.affinity;
    let gain;
    if (style === "deep") {
      gain = before >= 90 ? 1 : (Math.floor(Math.random() * 3) + 3); // 3-5
      state.difficulty = Math.min(3, state.difficulty + 1);
    } else {
      gain = before >= 90 ? 1 : (Math.floor(Math.random() * 2) + 1); // 1-2
      state.difficulty = Math.max(1, state.difficulty - 1);
    }
    rec.affinity = Math.min(100, rec.affinity + gain);
    const pointGain = gain;
    state.points += pointGain;
    saveState();

    const f = ROSTER.find(x => x.id === id);
    const lv = levelInfo(rec.affinity);
    const pool = f.lines[lv.key];
    const line = pool[Math.floor(Math.random() * pool.length)];
    document.getElementById("dialogueLog").textContent = `「${line}」  (+${pointGain}💎)`;
    document.querySelector(".lv-label").textContent = `Lv.${lv.lv} ${lv.label} (${rec.affinity}/100)`;
    document.querySelector(".affinity-bar > div").style.width = rec.affinity + "%";

    if (levelInfo(before).lv < lv.lv) {
      showToast(`✨ ${ROSTER.find(f=>f.id===id).name} との仲が深まった! Lv.${lv.lv} ${lv.label}`);
    }
    renderStats();
    renderGrid();
    updateGachaBtn();
  }

  function weightedPick(list) {
    const total = list.reduce((sum, f) => sum + RARITY_META[f.rarity].weight, 0);
    let r = Math.random() * total;
    for (const f of list) {
      r -= RARITY_META[f.rarity].weight;
      if (r <= 0) return f;
    }
    return list[list.length - 1];
  }

  const GACHA_COST = 30;
  function doGacha() {
    if (state.points < GACHA_COST) {
      showToast("きずなポイントが足りないよ!クイズに正解して集めよう");
      return;
    }
    state.points -= GACHA_COST;

    const unowned = ROSTER.filter(f => !isOwned(f.id));
    let picked, isNew;
    if (unowned.length > 0 && Math.random() < 0.7) {
      picked = weightedPick(unowned);
      isNew = true;
    } else {
      picked = weightedPick(ROSTER);
      isNew = !isOwned(picked.id);
    }

    const rm = RARITY_META[picked.rarity];
    const resultBox = document.getElementById("gachaResult");
    if (isNew) {
      state.friends[picked.id] = { affinity: 5 };
      resultBox.innerHTML = `
        <div class="rarity-badge modal-rarity" style="background:${rm.bg};color:${rm.color}">${rm.stars} ${rm.label}</div>
        <div class="emoji">${picked.emoji}</div>
        <p><b>${picked.name}</b> と友達になった!</p>
        <p style="font-size:0.8em;opacity:0.7">好きな話題: ${picked.topic}</p>
      `;
      showToast(`🎉 ${rm.label}の新しい友達: ${picked.name}`);
    } else {
      const rec = state.friends[picked.id];
      const gain = 8;
      rec.affinity = Math.min(100, rec.affinity + gain);
      resultBox.innerHTML = `
        <div class="rarity-badge modal-rarity" style="background:${rm.bg};color:${rm.color}">${rm.stars} ${rm.label}</div>
        <div class="emoji">${picked.emoji}</div>
        <p><b>${picked.name}</b> と再会! 好感度 +${gain}</p>
      `;
      showToast(`${picked.name} と再会したよ`);
    }
    resultBox.classList.remove("show");
    void resultBox.offsetWidth;
    resultBox.classList.add("show");

    saveState();
    renderStats();
    renderGrid();
    updateGachaBtn();
  }

  function updateGachaBtn() {
    document.getElementById("gachaBtn").disabled = state.points < GACHA_COST;
  }

  let currentQuestion = null;
  function loadQuestion() {
    const pool = QUESTIONS.filter(q => q.difficulty === state.difficulty);
    currentQuestion = pool[Math.floor(Math.random() * pool.length)];
    renderQuiz();
  }

  function renderQuiz() {
    const dm = DIFF_META[state.difficulty];
    const badge = document.getElementById("quizDiff");
    badge.textContent = `${dm.stars} ${dm.label}`;
    badge.style.color = dm.color;
    document.getElementById("quizQuestion").textContent = currentQuestion.q;
    const choicesDiv = document.getElementById("quizChoices");
    choicesDiv.innerHTML = "";
    currentQuestion.choices.forEach((c, i) => {
      const btn = document.createElement("button");
      btn.className = "quiz-choice-btn";
      btn.textContent = c;
      btn.addEventListener("click", () => answerQuiz(i, btn));
      choicesDiv.appendChild(btn);
    });
    document.getElementById("quizFeedback").textContent = "";
  }

  function answerQuiz(i, btn) {
    document.querySelectorAll(".quiz-choice-btn").forEach(b => b.disabled = true);
    const correct = i === currentQuestion.answer;
    const reward = REWARD_BY_DIFF[state.difficulty];
    const feedback = document.getElementById("quizFeedback");
    if (correct) {
      state.points += reward;
      btn.classList.add("correct");
      feedback.textContent = `✅ 正解! +${reward}💎`;
      feedback.className = "quiz-feedback ok";
      showToast(`正解! +${reward}きずなポイント`);
    } else {
      btn.classList.add("wrong");
      const correctText = currentQuestion.choices[currentQuestion.answer];
      feedback.textContent = `❌ 残念…正解は「${correctText}」`;
      feedback.className = "quiz-feedback ng";
    }
    saveState();
    renderStats();
    setTimeout(loadQuestion, 1100);
  }

  function switchTab(tab) {
    document.getElementById("tabCollection").classList.toggle("active", tab === "collection");
    document.getElementById("tabGacha").classList.toggle("active", tab === "gacha");
    document.getElementById("panelCollection").classList.toggle("active", tab === "collection");
    document.getElementById("panelGacha").classList.toggle("active", tab === "gacha");
  }

  document.getElementById("tabCollection").addEventListener("click", () => switchTab("collection"));
  document.getElementById("tabGacha").addEventListener("click", () => switchTab("gacha"));
  document.getElementById("gachaBtn").addEventListener("click", doGacha);
  document.getElementById("overlay").addEventListener("click", (e) => {
    if (e.target.id === "overlay") closeModal();
  });
  document.getElementById("resetBtn").addEventListener("click", () => {
    if (!confirm("本当に最初からやり直しますか?集めた友達や好感度はすべて消えます。")) return;
    localStorage.removeItem(SAVE_KEY);
    location.reload();
  });

  renderStats();
  renderGrid();
  updateGachaBtn();
  loadQuestion();
})();
</script>
